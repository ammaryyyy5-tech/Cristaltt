<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      cursor: pointer;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .profile-card {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 2;
      min-width: 280px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .avatar-container {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .status-dot {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 15px;
      height: 15px;
      background-color: #23a55a;
      border: 3.5px solid rgba(15, 15, 15, 0.9);
      border-radius: 50%;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .profile-status {
      font-size: 15px;
      color: #b5bac1;
      font-weight: 500;
    }

    /* تعديل: إنزال الحاوية لتبدأ من 60% من أعلى الشاشة */
    .center-container {
      position: fixed;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      text-align: center;
      pointer-events: none;
    }

    .center-text {
      font-family: 'Bring Race', sans-serif;
      font-size: 80px;
      color: #bf00ff;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #bf00ff;
      white-space: nowrap;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    .sub-text {
      font-family: 'Bring Race', sans-serif;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      max-width: 600px;
      /* ضمان توزيع النص بشكل جيد */
      margin-left: auto;
      margin-right: auto;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff;
        opacity: 0.8;
      }

      50% {
        text-shadow: 0 0 20px #bf00ff, 0 0 40px #bf00ff, 0 0 60px #8a2be2;
        opacity: 1;
      }
    }

    .info-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      z-index: 2;
      width: 300px;
      color: #fff;
    }

    .info-header {
      font-family: 'Bring Race', sans-serif;
      font-size: 14px;
      color: #b5bac1;
      margin-bottom: 10px;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }

    .info-item {
      margin-bottom: 8px;
    }

    .info-label {
      font-family: 'Bring Race', sans-serif;
      font-size: 10px;
      color: #888;
      display: block;
      margin-bottom: 2px;
    }

    .info-value {
      font-family: 'Bring Race', sans-serif;
      font-size: 12px;
      color: #fff;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <video class="video-bg" id="vid" loop playsinline muted>
    <source src="1.mp4" type="video/mp4">
  </video>

  <audio id="audio" loop>
    <source src="1.mp3" type="audio/mpeg">
  </audio>

  <div class="overlay"></div>

  <div class="profile-card">
    <div class="avatar-container">
      <img src="1.png" alt="avatar">
      <div class="status-dot"></div>
    </div>
    <div class="profile-info">
      <span class="profile-name">Fati7a Lbkaya</span>
      <span class="profile-status">Bkay Tiktok</span>
    </div>
  </div>

  <div class="center-container">
    <div class="center-text">🌈Fatiha Lbkaya🌈</div>
    <div class="sub-text"> Bkay Tiktok </div>
  </div>

  <script>
    const vid = document.getElementById('vid');
    const audio = document.getElementById('audio');

    function startExperience() {
      audio.play();
      vid.play();
      document.removeEventListener('click', startExperience);
      document.removeEventListener('keydown', startExperience);
    }

    document.addEventListener('click', startExperience);
    document.addEventListener('keydown', startExperience);

    window.onload = () => {
      vid.play().catch(() => { });
    };
  </script>

</body>

</html>
